_schema-version: "3.2"
ID: capire.sflight.draft.validation.sample.java
version: 1.0.0
description: "CAP sflight demo"

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx -p @sap/cds-dk cds build --profile production,node # generates gen/db

modules:
  # --------------------- SERVER MODULE ------------------------
  - name: sflight-draft-validation-sample-java-srv
  # ------------------------------------------------------------
    type: java
    path: srv
    properties:
      SPRING_PROFILES_ACTIVE: cloud
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ use_offline_repository: false, version: 21.+ }'
    requires:
      - name: sflight-draft-validation-sample-java-db
      - name: sflight-draft-validation-sample-java-uaa
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter, destinations)
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: sap_java_buildpack_jakarta
    build-parameters:
      builder: custom
      commands:
        - mvn clean package -DskipTests=true
      build-result: target/*-exec.jar
      ignore: ["node_modules/"]

  # -------------------- SIDECAR MODULE ------------------------
  - name: sflight-draft-validation-sample-java-db-deployer
  # ------------------------------------------------------------
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sflight-draft-validation-sample-java-db
      - name: sflight-draft-validation-sample-java-uaa
    build-parameters:
      ignore: ["node_modules/"]

  # ------------------ APPLICATION CONTENT ---------------------
  - name: sflight-draft-validation-sample-java-appcontent
  # ------------------------------------------------------------
    type: com.sap.application.content
    path: gen
    requires:
      - name: sflight-draft-validation-sample-java-destination-service
      - name: sflight-draft-validation-sample-java-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - name: sflight-draft-validation-sample-java-app-travel-processor
          artifacts:
            - travel-processor.zip
          target-path: app/
        - name: sflight-draft-validation-sample-java-app-travel-analytics
          artifacts:
            - travel-analytics.zip
          target-path: app/

  # ------------- APPLICATION: TRAVEL PROCESSOR ----------------
  - name: sflight-draft-validation-sample-java-app-travel-processor
  # ------------------------------------------------------------
    type: html5
    path: app/travel_processor
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []

  # ------------- APPLICATION: TRAVEL ANALYTICS ----------------
  - name: sflight-draft-validation-sample-java-app-travel-analytics
  # ------------------------------------------------------------
    type: html5
    path: app/travel_analytics
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []

  # ------------------ DESTINATION CONTENT ---------------------
  - name: sflight-draft-validation-sample-java-destinationcontent
  # ------------------------------------------------------------
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: sflight-draft-validation-sample-java-uaa
        parameters:
          service-key:
            name: sflight-draft-validation-sample-java-uaa-key
      - name: sflight-draft-validation-sample-java-html5-repo-host
        parameters:
          service-key:
            name: sflight-draft-validation-sample-java-html5-repo-host-key
      - name: sflight-draft-validation-sample-java-destination-service
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: sflight-draft-validation-sample-java-html5-repository
              ServiceInstanceName: sflight-draft-validation-sample-java-html5-repo-host
              ServiceKeyName: sflight-draft-validation-sample-java-html5-repo-host-key
              sap.cloud.service: sap.fe.cap.sflight
            - Name: sflight-draft-validation-sample-java-uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: sflight-draft-validation-sample-java-uaa
              ServiceKeyName: sflight-draft-validation-sample-java-uaa-key
              sap.cloud.service: sap.fe.cap.sflight

resources:
  # ------------------------------------------------------------
  - name: sflight-draft-validation-sample-java-db
  # ------------------------------------------------------------
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # ------------------------------------------------------------
  - name: sflight-draft-validation-sample-java-uaa
  # ------------------------------------------------------------
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./app/travel_processor/xs-security.json
      config:
        xsappname: sflight-draft-validation-sample-java-${space}
        tenant-mode: dedicated
        role-collections:
          - name: 'sflight-draft-validation-sample-java-reviewer-${space}'
            description: Review travels
            role-template-references:
              - $XSAPPNAME.reviewer
          - name: 'sflight-draft-validation-sample-java-processor-${space}'
            description: Process travels
            role-template-references:
              - $XSAPPNAME.processor
          - name: 'sflight-draft-validation-sample-java-admin-${space}'
            description: Manage travels
            role-template-references:
              - $XSAPPNAME.admin

  # ------------------------------------------------------------
  - name: sflight-draft-validation-sample-java-html5-repo-runtime
  # ------------------------------------------------------------
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # ------------------------------------------------------------
  - name: sflight-draft-validation-sample-java-html5-repo-host
  # ------------------------------------------------------------
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ------------------------------------------------------------
  - name: sflight-draft-validation-sample-java-destination-service
  # ------------------------------------------------------------
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        version: 1.0.0
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: sflight-draft-validation-sample-java-srv
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true

